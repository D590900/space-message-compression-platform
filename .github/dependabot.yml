version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      javascript:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /services/compression-worker
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /packages/sdk-python
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infra/docker/api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infra/docker/worker
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
