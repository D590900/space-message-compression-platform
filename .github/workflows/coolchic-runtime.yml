name: Cool-Chic runtime

on:
  pull_request:
    paths:
      - ".github/workflows/coolchic-runtime.yml"
      - "infra/docker/coolchic-runtime/**"
      - "services/compression-worker/model-runtime/coolchic-requirements.lock"
      - "services/compression-worker/model-manifests/**"
      - "services/compression-worker/src/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Normalize GHCR namespace
        id: registry
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Build exact Cool-Chic runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/coolchic-runtime/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=coolchic-a6fe38a414dd
          tags: smcp-coolchic-runtime:${{ github.sha }}
          cache-from: type=gha,scope=coolchic-runtime
          cache-to: type=gha,mode=max,scope=coolchic-runtime
      - name: Verify runtime contract
        env:
          IMAGE: smcp-coolchic-runtime:${{ github.sha }}
        run: |
          set -euo pipefail
          [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE") == "$GITHUB_SHA" ]]
          [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "$IMAGE") == "Apache-2.0 AND BSD-3-Clause" ]]
          [[ $(docker image inspect --format '{{ .Config.User }}' "$IMAGE") == smcp ]]
          docker run --rm --entrypoint /opt/coolchic-venv/bin/python "$IMAGE" -c \
            "import torch; from coolchic.bitstream.decode import decode_video; from smcp_worker.coolchic_runtime import unpack_container; assert torch.__version__ == '2.11.0+cpu'; assert decode_video and unpack_container"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c \
            'test ! -e /usr/bin/uv; test ! -e /usr/bin/uvx; test ! -e /var/lib/smcp/models; ! find /opt/coolchic -type f \( -name "*.pth" -o -name "*.pt" -o -name "*.ckpt" \) | grep .'
      - name: Exercise deterministic offline image and video round trips
        env:
          IMAGE: smcp-coolchic-runtime:${{ github.sha }}
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint /usr/bin/id "$IMAGE" -u smcp)
          gid=$(docker run --rm --entrypoint /usr/bin/id "$IMAGE" -g smcp)
          sudo install -d -o "$uid" -g "$gid" -m 0700 /tmp/coolchic-io
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=2147483648 \
            --mount type=bind,src=/tmp/coolchic-io,dst=/io --entrypoint /usr/local/bin/ffmpeg "$IMAGE" \
            -v error -f lavfi -i testsrc2=size=64x64:rate=2 -frames:v 1 -y /io/input.png
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=2147483648 \
            --mount type=bind,src=/tmp/coolchic-io,dst=/io --entrypoint /usr/local/bin/ffmpeg "$IMAGE" \
            -v error -f lavfi -i testsrc2=size=64x64:rate=2 -frames:v 2 -c:v ffv1 -pix_fmt yuv420p -y /io/input.avi
          for output in image.cool image-again.cool; do
            docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=2147483648 \
              --mount type=bind,src=/tmp/coolchic-io,dst=/io \
              --entrypoint /opt/coolchic-venv/bin/python "$IMAGE" -m smcp_worker.coolchic_runtime encode-image \
              --source-root /opt/coolchic --input /io/input.png --output "/io/$output" --iterations 1
          done
          cmp /tmp/coolchic-io/image.cool /tmp/coolchic-io/image-again.cool
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=2147483648 \
            --mount type=bind,src=/tmp/coolchic-io,dst=/io \
            --entrypoint /opt/coolchic-venv/bin/python "$IMAGE" -m smcp_worker.coolchic_runtime decode-image \
            --source-root /opt/coolchic --input /io/image.cool --output /io/decoded.png
          for output in video.cool video-again.cool; do
            docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=2147483648 \
              --mount type=bind,src=/tmp/coolchic-io,dst=/io \
              --entrypoint /opt/coolchic-venv/bin/python "$IMAGE" -m smcp_worker.coolchic_runtime encode-video \
              --source-root /opt/coolchic --input /io/input.avi --output "/io/$output" --iterations 1
          done
          cmp /tmp/coolchic-io/video.cool /tmp/coolchic-io/video-again.cool
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=2147483648 \
            --mount type=bind,src=/tmp/coolchic-io,dst=/io \
            --entrypoint /opt/coolchic-venv/bin/python "$IMAGE" -m smcp_worker.coolchic_runtime decode-video \
            --source-root /opt/coolchic --input /io/video.cool --output /io/decoded.avi
          docker run --rm --network none --read-only --mount type=bind,src=/tmp/coolchic-io,dst=/io,readonly \
            --entrypoint /usr/local/bin/ffprobe "$IMAGE" -v error -count_frames \
            -show_entries stream=codec_type,width,height,nb_read_frames -of json /io/decoded.avi | tee /tmp/coolchic-probe.json
          jq -e '[.streams[] | select(.codec_type == "video" and .width == 64 and .height == 64 and .nb_read_frames == "2")] | length == 1' /tmp/coolchic-probe.json
      - name: Reject malformed containers before upstream decode
        env:
          IMAGE: smcp-coolchic-runtime:${{ github.sha }}
        run: |
          set -euo pipefail
          cp /tmp/coolchic-io/image.cool /tmp/coolchic-io/corrupt.cool
          printf x >> /tmp/coolchic-io/corrupt.cool
          if docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=2147483648 \
            --mount type=bind,src=/tmp/coolchic-io,dst=/io \
            --entrypoint /opt/coolchic-venv/bin/python "$IMAGE" -m smcp_worker.coolchic_runtime decode-image \
            --source-root /opt/coolchic --input /io/corrupt.cool --output /io/invalid.png; then exit 1; fi
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: smcp-coolchic-runtime:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate exact-image SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: smcp-coolchic-runtime:${{ github.sha }}
          format: spdx-json
          output: smcp-coolchic-runtime-${{ github.sha }}.spdx.json
      - name: Sign in to GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fa # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned runtime without rebuilding
        if: github.event_name == 'workflow_dispatch'
        id: publish
        env:
          LOCAL_IMAGE: smcp-coolchic-runtime:${{ github.sha }}
          IMAGE_NAME: ghcr.io/${{ steps.registry.outputs.owner }}/smcp-coolchic-runtime
          VERSION: coolchic-a6fe38a414dd
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE" "${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:${VERSION}"
          digest=$(docker image inspect --format '{{ index .RepoDigests 0 }}' "${IMAGE_NAME}:${VERSION}")
          digest=${digest##*@}
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest" > coolchic-runtime-digest.txt
      - name: Attest exact runtime provenance
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ steps.registry.outputs.owner }}/smcp-coolchic-runtime
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Upload runtime audit artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coolchic-runtime-${{ github.sha }}
          path: |
            smcp-coolchic-runtime-${{ github.sha }}.spdx.json
            coolchic-runtime-digest.txt
          if-no-files-found: ${{ github.event_name == 'workflow_dispatch' && 'error' || 'warn' }}
          retention-days: 90
