name: Release candidate audit

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate semantic version
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require an untagged main-branch release commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2153
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${VERSION#v}
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]]

          manifest_versions=(
            "$(jq -r '.version' package.json)"
            "$(jq -r '.version' apps/api/package.json)"
            "$(jq -r '.version' apps/cli/package.json)"
            "$(jq -r '.version' packages/schemas/package.json)"
            "$(jq -r '.version' packages/sdk-typescript/package.json)"
            "$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml)"
            "$(sed -nE 's/^version = "([^"]+)"$/\1/p' services/compression-worker/pyproject.toml)"
            "$(sed -nE 's/^version = "([^"]+)"$/\1/p' packages/sdk-python/pyproject.toml)"
          )
          for manifest_version in "${manifest_versions[@]}"; do
            [[ -n "$manifest_version" && "$manifest_version" == "$version" ]]
          done

  images:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [web, api, worker, capsule]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build exact candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/${{ matrix.image }}/Dockerfile
          push: false
          load: true
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ inputs.version }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          tags: smcp-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Verify candidate image labels
        env:
          IMAGE: smcp-${{ matrix.image }}:${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE") == "$GITHUB_SHA" ]]
          [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE") == "$VERSION" ]]
          [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "$IMAGE") == "Apache-2.0" ]]
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: smcp-${{ matrix.image }}:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate exact-image SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: smcp-${{ matrix.image }}:${{ github.sha }}
          format: spdx-json
          output: smcp-${{ matrix.image }}-${{ github.sha }}.spdx.json
      - name: Verify first-party SBOM license metadata
        env:
          IMAGE: ${{ matrix.image }}
          SBOM: smcp-${{ matrix.image }}-${{ github.sha }}.spdx.json
        run: |
          set -euo pipefail
          case "$IMAGE" in
            web) packages=('@smcp/web') ;;
            api) packages=('@smcp/api' '@smcp/schemas') ;;
            worker) packages=('smcp-compression-worker') ;;
            capsule) packages=() ;;
            *) exit 2 ;;
          esac
          for package in "${packages[@]}"; do
            jq --exit-status --arg package "$package" \
              'any(.packages[]; .name == $package and .licenseDeclared == "Apache-2.0")' \
              "$SBOM" >/dev/null
          done
      - name: Add SBOM checksum
        run: sha256sum smcp-${{ matrix.image }}-${{ github.sha }}.spdx.json > SHA256SUMS
      - name: Upload audited candidate SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ matrix.image }}-${{ github.sha }}
          path: |
            smcp-${{ matrix.image }}-${{ github.sha }}.spdx.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90
