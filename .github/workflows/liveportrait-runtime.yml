name: LivePortrait runtime

on:
  pull_request:
    paths:
      - ".github/workflows/liveportrait-runtime.yml"
      - "infra/docker/liveportrait-runtime/**"
      - "services/compression-worker/model-manifests/**"
      - "services/compression-worker/src/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Normalize GHCR namespace
        id: registry
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Build exact detector-free runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/liveportrait-runtime/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=liveportrait-human-82a4fa6735ca
          tags: smcp-liveportrait-runtime:${{ github.sha }}
          cache-from: type=gha,scope=liveportrait-runtime
          cache-to: type=gha,mode=max,scope=liveportrait-runtime
      - name: Verify runtime and exclusion contract
        env:
          IMAGE: smcp-liveportrait-runtime:${{ github.sha }}
        run: |
          set -euo pipefail
          [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE") == "$GITHUB_SHA" ]]
          [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "$IMAGE") == "Apache-2.0 AND MIT" ]]
          [[ $(docker image inspect --format '{{ .Config.User }}' "$IMAGE") == smcp ]]
          docker run --rm --entrypoint /opt/encodec-venv/bin/python "$IMAGE" -c \
            "import torch; from src.modules.appearance_feature_extractor import AppearanceFeatureExtractor; from src.modules.motion_extractor import MotionExtractor; from src.modules.spade_generator import SPADEDecoder; from src.modules.warping_network import WarpingNetwork; from smcp_worker.liveportrait_runtime import unpack_container; assert torch.__version__ == '2.6.0+cpu'; assert AppearanceFeatureExtractor and MotionExtractor and SPADEDecoder and WarpingNetwork and unpack_container"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c \
            'test ! -e /var/lib/smcp/models/liveportrait; test ! -e /opt/liveportrait/src/utils/cropper.py; ! find /opt/liveportrait -iname "*insightface*" -o -iname "*crop*" -o -iname "*landmark*" | grep .'
      - name: Fetch and verify approved external artifacts
        env:
          IMAGE: smcp-liveportrait-runtime:${{ github.sha }}
        run: |
          set -euo pipefail
          lp=/tmp/models/liveportrait/liveportrait-human-82a4fa6735ca
          enc=/tmp/models/encodec/encodec-48khz-c3def8e7185a
          install -d -m 0700 "$lp" "$enc"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$lp/appearance_feature_extractor.pth" \
            https://huggingface.co/KlingTeam/LivePortrait/resolve/82a4fa6735ca58432b6ce39301b4b9ee066dea47/liveportrait/base_models/appearance_feature_extractor.pth
          curl --fail --location --proto '=https' --tlsv1.2 --output "$lp/motion_extractor.pth" \
            https://huggingface.co/KlingTeam/LivePortrait/resolve/82a4fa6735ca58432b6ce39301b4b9ee066dea47/liveportrait/base_models/motion_extractor.pth
          curl --fail --location --proto '=https' --tlsv1.2 --output "$lp/spade_generator.pth" \
            https://huggingface.co/KlingTeam/LivePortrait/resolve/82a4fa6735ca58432b6ce39301b4b9ee066dea47/liveportrait/base_models/spade_generator.pth
          curl --fail --location --proto '=https' --tlsv1.2 --output "$lp/warping_module.pth" \
            https://huggingface.co/KlingTeam/LivePortrait/resolve/82a4fa6735ca58432b6ce39301b4b9ee066dea47/liveportrait/base_models/warping_module.pth
          curl --fail --location --proto '=https' --tlsv1.2 --output "$lp/config.yaml" \
            https://raw.githubusercontent.com/KlingAIResearch/LivePortrait/9b294b3d0536135442ea73cb01e6cb3ca7029dd3/src/config/models.yaml
          curl --fail --location --proto '=https' --tlsv1.2 --output "$enc/weights.bin" \
            https://huggingface.co/facebook/encodec_48khz/resolve/c3def8e7185ac8c8efdce6eb8c4a651e487a503e/model.safetensors
          curl --fail --location --proto '=https' --tlsv1.2 --output "$enc/config.yaml" \
            https://huggingface.co/facebook/encodec_48khz/resolve/c3def8e7185ac8c8efdce6eb8c4a651e487a503e/config.json
          echo '5279bb8654293dbdf327030b397f107237dd9212fb11dd75b83dfb635211ceb5  /tmp/models/liveportrait/liveportrait-human-82a4fa6735ca/appearance_feature_extractor.pth' | sha256sum --check --strict
          echo '251e6a94ad667a1d0c69526d292677165110ef7f0cf0f6d199f0e414e8aa0ca5  /tmp/models/liveportrait/liveportrait-human-82a4fa6735ca/motion_extractor.pth' | sha256sum --check --strict
          echo '4780afc7909a9f84e24c01d73b31a555ef651521a1fe3b2429bd04534d992aee  /tmp/models/liveportrait/liveportrait-human-82a4fa6735ca/spade_generator.pth' | sha256sum --check --strict
          echo '2f61a6f265fe344f14132364859a78bdbbc2068577170693da57fb96d636e282  /tmp/models/liveportrait/liveportrait-human-82a4fa6735ca/warping_module.pth' | sha256sum --check --strict
          echo 'da135e5d5104441675411caba2ededdf26606bfa8a511a2504018d2d149512c4  /tmp/models/liveportrait/liveportrait-human-82a4fa6735ca/config.yaml' | sha256sum --check --strict
          echo '47a15ffbaf7bb76176d0833e10590de0a8988a7848748608cefc36a1c88adfdc  /tmp/models/encodec/encodec-48khz-c3def8e7185a/weights.bin' | sha256sum --check --strict
          echo '4a914ed15ed5a69e19932d05b0c51f2d22c68ffac70e959a757594cb0cd6e2a7  /tmp/models/encodec/encodec-48khz-c3def8e7185a/config.yaml' | sha256sum --check --strict
          uid=$(docker run --rm --entrypoint /usr/bin/id "$IMAGE" -u smcp)
          gid=$(docker run --rm --entrypoint /usr/bin/id "$IMAGE" -g smcp)
          chmod 0400 /tmp/models/liveportrait/liveportrait-human-82a4fa6735ca/* /tmp/models/encodec/encodec-48khz-c3def8e7185a/*
          sudo chown -R "$uid:$gid" /tmp/models
      - name: Exercise deterministic real encode and decode
        env:
          IMAGE: smcp-liveportrait-runtime:${{ github.sha }}
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint /usr/bin/id "$IMAGE" -u smcp)
          gid=$(docker run --rm --entrypoint /usr/bin/id "$IMAGE" -g smcp)
          sudo install -d -o "$uid" -g "$gid" -m 0700 /tmp/liveportrait-io
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=2147483648 \
            --mount type=bind,src=/tmp/liveportrait-io,dst=/io --entrypoint /usr/local/bin/ffmpeg "$IMAGE" \
            -v error -f lavfi -i testsrc2=size=512x512:rate=10:duration=0.2 \
            -f lavfi -i sine=frequency=440:sample_rate=48000:duration=1 -map 0:v:0 -map 1:a:0 \
            -c:v ffv1 -pix_fmt yuv420p -c:a pcm_s16le -y /io/input.avi
          for output in output.lprt output-again.lprt; do
            docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=2147483648 \
              --mount type=bind,src=/tmp/models,dst=/models,readonly \
              --mount type=bind,src=/tmp/liveportrait-io,dst=/io \
              --entrypoint /opt/encodec-venv/bin/python "$IMAGE" -m smcp_worker.liveportrait_runtime encode \
              --source-root /opt/liveportrait --weights-root /models/liveportrait/liveportrait-human-82a4fa6735ca \
              --config /models/liveportrait/liveportrait-human-82a4fa6735ca/config.yaml \
              --encodec-weights /models/encodec/encodec-48khz-c3def8e7185a/weights.bin \
              --encodec-config /models/encodec/encodec-48khz-c3def8e7185a/config.yaml \
              --input /io/input.avi --output "/io/$output" --quantizer 35
          done
          docker run --rm --network none --read-only \
            --mount type=bind,src=/tmp/liveportrait-io,dst=/io,readonly \
            --entrypoint /usr/bin/cmp "$IMAGE" /io/output.lprt /io/output-again.lprt
          docker run --rm --network none --read-only \
            --mount type=bind,src=/tmp/liveportrait-io,dst=/io,readonly \
            --entrypoint /opt/encodec-venv/bin/python "$IMAGE" -c \
            "from pathlib import Path; from smcp_worker.encodec_runtime import unpack_tokens; from smcp_worker.liveportrait_runtime import unpack_container; audio = unpack_container(Path('/io/output.lprt').read_bytes())[-1]; assert unpack_tokens(audio)[0] == 9600"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=2147483648 \
            --mount type=bind,src=/tmp/models,dst=/models,readonly \
            --mount type=bind,src=/tmp/liveportrait-io,dst=/io \
            --entrypoint /opt/encodec-venv/bin/python "$IMAGE" -m smcp_worker.liveportrait_runtime decode \
            --source-root /opt/liveportrait --weights-root /models/liveportrait/liveportrait-human-82a4fa6735ca \
            --config /models/liveportrait/liveportrait-human-82a4fa6735ca/config.yaml \
            --encodec-weights /models/encodec/encodec-48khz-c3def8e7185a/weights.bin \
            --encodec-config /models/encodec/encodec-48khz-c3def8e7185a/config.yaml \
            --input /io/output.lprt --output /io/decoded.avi
          docker run --rm --network none --read-only --mount type=bind,src=/tmp/liveportrait-io,dst=/io,readonly \
            --entrypoint /usr/local/bin/ffprobe "$IMAGE" -v error -count_frames \
            -show_entries stream=codec_type,codec_name,width,height,avg_frame_rate,nb_read_frames,sample_rate,channels \
            -of json /io/decoded.avi | tee /tmp/liveportrait-probe.json
          jq -e '[.streams[] | select(.codec_type == "video" and .codec_name == "ffv1" and .width == 512 and .height == 512 and .avg_frame_rate == "10/1" and .nb_read_frames == "2")] | length == 1' /tmp/liveportrait-probe.json
          jq -e '[.streams[] | select(.codec_type == "audio" and .codec_name == "pcm_s16le" and .sample_rate == "48000" and .channels == 2)] | length == 1' /tmp/liveportrait-probe.json
          docker run --rm --network none --read-only \
            --mount type=bind,src=/tmp/liveportrait-io,dst=/io,readonly \
            --entrypoint /bin/sh "$IMAGE" -c \
            'test "$(stat -c %s /io/output.lprt)" -lt "$(stat -c %s /io/input.avi)"'
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: smcp-liveportrait-runtime:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate exact-image SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: smcp-liveportrait-runtime:${{ github.sha }}
          format: spdx-json
          output: smcp-liveportrait-runtime-${{ github.sha }}.spdx.json
      - name: Sign in to GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fa # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned runtime without rebuilding
        if: github.event_name == 'workflow_dispatch'
        id: publish
        env:
          LOCAL_IMAGE: smcp-liveportrait-runtime:${{ github.sha }}
          IMAGE_NAME: ghcr.io/${{ steps.registry.outputs.owner }}/smcp-liveportrait-runtime
          VERSION: liveportrait-human-82a4fa6735ca
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE" "${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:${VERSION}"
          digest=$(docker image inspect --format '{{ index .RepoDigests 0 }}' "${IMAGE_NAME}:${VERSION}")
          digest=${digest##*@}
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest" > liveportrait-runtime-digest.txt
          printf '### Published LivePortrait runtime\n\n`%s@%s`\n' "$IMAGE_NAME" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest exact runtime provenance
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ steps.registry.outputs.owner }}/smcp-liveportrait-runtime
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Upload runtime audit artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: liveportrait-runtime-${{ github.sha }}
          path: |
            smcp-liveportrait-runtime-${{ github.sha }}.spdx.json
            liveportrait-runtime-digest.txt
          if-no-files-found: ${{ github.event_name == 'workflow_dispatch' && 'error' || 'warn' }}
          retention-days: 90
