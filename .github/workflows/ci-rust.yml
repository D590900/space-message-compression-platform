name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: rust-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Cache Cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Verify committed golden vector
        run: |
          sha256sum --check packages/test-vectors/capsules/v1-golden.capsule.sha256
          cargo run --quiet --locked -p smcp-capsule-cli -- verify packages/test-vectors/capsules/v1-golden.capsule

  fuzz-smoke:
    name: rust-fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned nightly toolchain
        run: rustup toolchain install nightly-2026-08-15 --profile minimal
      - name: Install pinned cargo-fuzz
        run: cargo +nightly-2026-08-15 install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz parser
        run: >-
          cargo +nightly-2026-08-15 fuzz run parse
          --fuzz-dir crates/capsule-format/fuzz --
          -max_total_time=15 -rss_limit_mb=2048 -print_final_stats=1
