name: HiNeRV runtime

on:
  pull_request:
    paths:
      - ".github/workflows/hinerv-runtime.yml"
      - "infra/docker/hinerv-runtime/**"
      - "services/compression-worker/model-runtime/hinerv-requirements.lock"
      - "services/compression-worker/model-manifests/**"
      - "services/compression-worker/src/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Normalize GHCR namespace
        id: registry
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Build exact HiNeRV runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/hinerv-runtime/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=hinerv-fdb92ec22492
          tags: smcp-hinerv-runtime:${{ github.sha }}
          cache-from: type=gha,scope=hinerv-runtime
          cache-to: type=gha,mode=max,scope=hinerv-runtime
      - name: Verify runtime and hardened decoder contract
        env:
          IMAGE: smcp-hinerv-runtime:${{ github.sha }}
        run: |
          set -euo pipefail
          [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE") == "$GITHUB_SHA" ]]
          [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "$IMAGE") == "Apache-2.0 AND MIT" ]]
          [[ $(docker image inspect --format '{{ .Config.User }}' "$IMAGE") == smcp ]]
          docker run --rm --entrypoint /opt/hinerv-venv/bin/python "$IMAGE" -c \
            "import torch, torchac.torchac as impl; from compression.codec_utils import _safe_extract_archive; from smcp_worker.hinerv_runtime import unpack_container; assert torch.__version__ == '2.6.0+cpu'; assert impl.torchac_backend and _safe_extract_archive and unpack_container"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c \
            'test ! -e /usr/bin/g++; test ! -e /usr/bin/ninja; test ! -e /usr/bin/uv; test ! -e /usr/bin/uvx; test ! -e /var/lib/smcp/models'
      - name: Exercise deterministic offline video round trip
        env:
          IMAGE: smcp-hinerv-runtime:${{ github.sha }}
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint /usr/bin/id "$IMAGE" -u smcp)
          gid=$(docker run --rm --entrypoint /usr/bin/id "$IMAGE" -g smcp)
          sudo install -d -o "$uid" -g "$gid" -m 0700 /tmp/hinerv-io
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=2147483648 \
            --mount type=bind,src=/tmp/hinerv-io,dst=/io --entrypoint /usr/local/bin/ffmpeg "$IMAGE" \
            -v error -f lavfi -i testsrc2=size=64x64:rate=2 -frames:v 2 -c:v ffv1 -pix_fmt yuv420p -y /io/input.avi
          for output in output.hnrv output-again.hnrv; do
            docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=4294967296 \
              --mount type=bind,src=/tmp/hinerv-io,dst=/io \
              --entrypoint /opt/hinerv-venv/bin/python "$IMAGE" -m smcp_worker.hinerv_runtime encode \
              --source-root /opt/hinerv --python /opt/hinerv-venv/bin/python \
              --input /io/input.avi --output "/io/$output" --epochs 1 --channels 8
          done
          docker run --rm --network none --read-only --mount type=bind,src=/tmp/hinerv-io,dst=/io,readonly \
            --entrypoint /usr/bin/cmp "$IMAGE" /io/output.hnrv /io/output-again.hnrv
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=4294967296 \
            --mount type=bind,src=/tmp/hinerv-io,dst=/io \
            --entrypoint /opt/hinerv-venv/bin/python "$IMAGE" -m smcp_worker.hinerv_runtime decode \
            --source-root /opt/hinerv --python /opt/hinerv-venv/bin/python \
            --input /io/output.hnrv --output /io/decoded.avi
          docker run --rm --network none --read-only --mount type=bind,src=/tmp/hinerv-io,dst=/io,readonly \
            --entrypoint /usr/local/bin/ffprobe "$IMAGE" -v error -count_frames \
            -show_entries stream=codec_type,width,height,nb_read_frames -of json /io/decoded.avi | tee /tmp/hinerv-probe.json
          jq -e '[.streams[] | select(.codec_type == "video" and .width == 64 and .height == 64 and .nb_read_frames == "2")] | length == 1' /tmp/hinerv-probe.json
      - name: Reject malformed containers before model loading
        env:
          IMAGE: smcp-hinerv-runtime:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --mount type=bind,src=/tmp/hinerv-io,dst=/io \
            --entrypoint /bin/sh "$IMAGE" -c 'cp /io/output.hnrv /io/corrupt.hnrv; printf x >> /io/corrupt.hnrv'
          if docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=4294967296 \
            --mount type=bind,src=/tmp/hinerv-io,dst=/io \
            --entrypoint /opt/hinerv-venv/bin/python "$IMAGE" -m smcp_worker.hinerv_runtime decode \
            --source-root /opt/hinerv --python /opt/hinerv-venv/bin/python \
            --input /io/corrupt.hnrv --output /io/invalid.avi; then exit 1; fi
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: smcp-hinerv-runtime:${{ github.sha }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate exact-image SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: smcp-hinerv-runtime:${{ github.sha }}
          format: spdx-json
          output: smcp-hinerv-runtime-${{ github.sha }}.spdx.json
      - name: Sign in to GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fa # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned runtime without rebuilding
        if: github.event_name == 'workflow_dispatch'
        id: publish
        env:
          LOCAL_IMAGE: smcp-hinerv-runtime:${{ github.sha }}
          IMAGE_NAME: ghcr.io/${{ steps.registry.outputs.owner }}/smcp-hinerv-runtime
          VERSION: hinerv-fdb92ec22492
        run: |
          set -euo pipefail
          docker tag "$LOCAL_IMAGE" "${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:${VERSION}"
          digest=$(docker image inspect --format '{{ index .RepoDigests 0 }}' "${IMAGE_NAME}:${VERSION}")
          digest=${digest##*@}
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest" > hinerv-runtime-digest.txt
      - name: Attest exact runtime provenance
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ steps.registry.outputs.owner }}/smcp-hinerv-runtime
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Upload runtime audit artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hinerv-runtime-${{ github.sha }}
          path: |
            smcp-hinerv-runtime-${{ github.sha }}.spdx.json
            hinerv-runtime-digest.txt
          if-no-files-found: ${{ github.event_name == 'workflow_dispatch' && 'error' || 'warn' }}
          retention-days: 90
