name: Compose smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    name: compose-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      WORKER_CLAIM_IDLE_MS: "10000"
      JOB_OUTBOX_RECONCILE_MS: "1000"
      JOB_OUTBOX_STALE_MS: "60000"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build web api worker
      - name: Start stack
        run: docker compose up --detach --wait postgres valkey minio create-bucket migrate api worker web
      - name: Check API health
        run: curl --fail --retry 10 --retry-all-errors http://127.0.0.1:3001/health/ready
      - name: Check dashboard health
        run: curl --fail --retry 10 --retry-all-errors http://127.0.0.1:3000/health
      - name: Reapply migrations idempotently
        run: docker compose run --rm migrate
      - name: Reconcile a PostgreSQL job after Valkey delivery loss
        run: |
          set -euo pipefail
          job_id=00000000-0000-4000-8000-000000000101
          project_id=00000000-0000-4000-8000-000000000102
          source_id=00000000-0000-4000-8000-000000000103
          marker="smcp:job-delivery:compression.requested:$job_id"
          docker compose stop worker
          docker compose exec -T valkey valkey-cli DEL smcp:compression-jobs "$marker" >/dev/null
          docker compose exec -T valkey valkey-cli SADD "$marker" 0-1 >/dev/null
          docker compose exec -T postgres psql -U smcp -d smcp -v ON_ERROR_STOP=1 \
            -c "INSERT INTO projects (id, tenant_subject, name) VALUES ('$project_id', 'org_reconcile_ci', 'Reconciliation CI')" \
            -c "INSERT INTO source_objects (id, tenant_subject, project_id, object_key, declared_mime, expected_bytes, upload_expires_at) VALUES ('$source_id', 'org_reconcile_ci', '$project_id', 'ci/reconcile.txt', 'text/plain', 1, now() + interval '1 hour')" \
            -c "INSERT INTO compression_jobs (id, tenant_subject, project_id, input_type, profile, source_object_id, idempotency_key, request_fingerprint) VALUES ('$job_id', 'org_reconcile_ci', '$project_id', 'TEXT', 'faithful', '$source_id', 'reconcile-ci', decode(repeat('00', 32), 'hex'))" \
            -c "INSERT INTO outbox_events (tenant_subject, project_id, topic, aggregate_id, payload, published_at) VALUES ('org_reconcile_ci', '$project_id', 'compression.requested', '$job_id', jsonb_build_object('job_id', '$job_id', 'transport_marker_version', 1), now() - interval '2 minutes')"
          sleep 2
          intact_events=$(docker compose exec -T postgres psql -U smcp -d smcp -Atc \
            "SELECT count(*) FROM outbox_events WHERE aggregate_id = '$job_id'")
          [ "$intact_events" = 1 ] || { echo "intact delivery duplicated"; exit 1; }
          docker compose exec -T valkey valkey-cli DEL "$marker" >/dev/null
          for attempt in $(seq 1 20); do
            events=$(docker compose exec -T postgres psql -U smcp -d smcp -Atc \
              "SELECT count(*) FROM outbox_events WHERE aggregate_id = '$job_id' AND published_at IS NOT NULL")
            stream=$(docker compose exec -T valkey valkey-cli --raw XRANGE smcp:compression-jobs - +)
            marker_exists=$(docker compose exec -T valkey valkey-cli EXISTS "$marker")
            if [ "$events" -ge 2 ] && [ "$marker_exists" = 1 ] && grep -Fq "$job_id" <<<"$stream"; then
              docker compose exec -T valkey valkey-cli DEL smcp:compression-jobs "$marker" >/dev/null
              docker compose exec -T valkey valkey-cli XGROUP CREATE \
                smcp:compression-jobs compression-workers 0 MKSTREAM >/dev/null
              docker compose exec -T postgres psql -U smcp -d smcp -v ON_ERROR_STOP=1 \
                -c "DELETE FROM outbox_events WHERE aggregate_id = '$job_id'" \
                -c "DELETE FROM compression_jobs WHERE id = '$job_id'" \
                -c "DELETE FROM source_objects WHERE id = '$source_id'" \
                -c "DELETE FROM projects WHERE id = '$project_id'"
              exit 0
            fi
            echo "reconciliation poll $attempt/20: published_events=$events marker=$marker_exists"
            sleep 1
          done
          docker compose logs --no-color api
          exit 1
      - name: Recover a delivery left pending by a stopped worker
        run: |
          docker compose stop worker
          message_id=$(docker compose exec -T valkey valkey-cli --raw XADD smcp:compression-jobs '*' job_id 00000000-0000-0000-0000-000000000001 tenant_subject test-tenant)
          docker compose exec -T valkey valkey-cli --raw XREADGROUP GROUP compression-workers stopped-worker COUNT 1 STREAMS smcp:compression-jobs '>' | grep -F "$message_id"
          docker compose up --detach worker
          for attempt in $(seq 1 30); do
            pending=$(docker compose exec -T valkey valkey-cli --raw XPENDING smcp:compression-jobs compression-workers | head -n 1)
            if [ "$pending" = "0" ]; then
              exit 0
            fi
            echo "claim poll $attempt/30: pending=$pending"
            sleep 1
          done
          docker compose logs --no-color worker
          exit 1
      - name: Capture diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
