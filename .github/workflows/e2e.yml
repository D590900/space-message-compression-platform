name: Compose smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build api worker
      - name: Start stack
        run: docker compose up --detach --wait postgres valkey minio create-bucket migrate api worker
      - name: Check API health
        run: curl --fail --retry 10 --retry-all-errors http://127.0.0.1:3001/health/ready
      - name: Reapply migrations idempotently
        run: docker compose run --rm migrate
      - name: Capture diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
