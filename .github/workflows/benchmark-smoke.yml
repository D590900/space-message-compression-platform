name: Benchmark smoke

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "crates/**"
      - "services/compression-worker/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: benchmark-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.13"
      - name: Configure uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.11.21"
      - name: Verify synthetic fixture hashes
        run: python benchmarks/datasets/generate.py --verify
      - name: Install worker benchmark dependencies
        working-directory: services/compression-worker
        run: uv sync --frozen
      - name: Run text baseline smoke
        working-directory: services/compression-worker
        run: >-
          uv run python ../../benchmarks/runners/run_baselines.py
          --types text --output ../../benchmark-results/ci
      - name: Run capsule benchmark smoke
        run: >-
          cargo run --locked --release -p smcp-capsule-cli --
          benchmark packages/test-vectors/capsules/v1-golden.capsule
          --iterations 5
