name: Python

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - services/compression-worker
          - packages/sdk-python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.13"
      - name: Configure uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: ${{ matrix.package }}/uv.lock
      - name: Install CPU codec tools
        if: matrix.package == 'services/compression-worker'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg libavif-bin libjxl-tools
      - name: Install locked dependencies
        working-directory: ${{ matrix.package }}
        run: uv sync --frozen
      - name: Lint
        working-directory: ${{ matrix.package }}
        run: uv run ruff check src tests
      - name: Type check
        working-directory: ${{ matrix.package }}
        run: uv run mypy src
      - name: Test
        working-directory: ${{ matrix.package }}
        run: uv run pytest -q
      - name: Validate model provenance catalog
        if: matrix.package == 'services/compression-worker'
        working-directory: services/compression-worker
        run: uv run python -m smcp_worker.model_manifest validate model-manifests/catalog.json
