name: Clerk integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clerk-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-key-lifecycle:
    name: protected-clerk-api-key-lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLERK_INTEGRATION: "1"
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_TEST_ORG_ID: ${{ secrets.CLERK_TEST_ORG_ID }}
      CLERK_TEST_USER_ID: ${{ secrets.CLERK_TEST_USER_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require protected Clerk configuration
        run: |
          set -euo pipefail
          required=(
            CLERK_SECRET_KEY CLERK_PUBLISHABLE_KEY
            CLERK_TEST_ORG_ID CLERK_TEST_USER_ID
          )
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name is not configured"; exit 1; }
          done
      - name: Set up pnpm
        uses: pnpm/action-setup@41ff726559283e19c3c38ab05c5cc6151047f6e4 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.10.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run real Clerk lifecycle test
        run: pnpm --filter @smcp/api exec vitest run test/clerk.integration.test.ts
