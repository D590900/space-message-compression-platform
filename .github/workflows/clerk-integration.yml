name: Clerk integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clerk-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-key-lifecycle:
    name: protected-clerk-api-key-lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLERK_INTEGRATION: "1"
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_TEST_ORG_ID: ${{ secrets.CLERK_TEST_ORG_ID }}
      CLERK_TEST_USER_ID: ${{ secrets.CLERK_TEST_USER_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require protected Clerk configuration
        run: |
          set -euo pipefail
          required=(
            CLERK_SECRET_KEY CLERK_PUBLISHABLE_KEY
            CLERK_TEST_ORG_ID CLERK_TEST_USER_ID
          )
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || { echo "::error::$name is not configured"; exit 1; }
          done
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.10.0
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run real Clerk lifecycle test
        run: pnpm --filter @smcp/api exec vitest run test/clerk.integration.test.ts
