name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out full repository history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require a merged, version-consistent release commit
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${VERSION#v}
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          manifest_versions=(
            "$(jq -r '.version' package.json)"
            "$(jq -r '.version' apps/api/package.json)"
            "$(jq -r '.version' apps/cli/package.json)"
            "$(jq -r '.version' packages/schemas/package.json)"
            "$(jq -r '.version' packages/sdk-typescript/package.json)"
            "$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml)"
            "$(sed -nE 's/^version = "([^"]+)"$/\1/p' services/compression-worker/pyproject.toml)"
            "$(sed -nE 's/^version = "([^"]+)"$/\1/p' packages/sdk-python/pyproject.toml)"
          )
          for manifest_version in "${manifest_versions[@]}"; do
            [[ -n "$manifest_version" && "$manifest_version" == "$version" ]]
          done

  images:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [web, api, worker, capsule]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configure Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}/Dockerfile
          push: false
          load: true
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/smcp-${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/smcp-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/smcp-${{ matrix.image }}:${{ github.ref_name }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate exact-image SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/smcp-${{ matrix.image }}:${{ github.ref_name }}
          format: spdx-json
          output: smcp-${{ matrix.image }}-${{ github.ref_name }}.spdx.json
      - name: Verify first-party SBOM license metadata
        env:
          IMAGE: ${{ matrix.image }}
          SBOM: smcp-${{ matrix.image }}-${{ github.ref_name }}.spdx.json
        run: |
          set -euo pipefail
          case "$IMAGE" in
            web) packages=('@smcp/web') ;;
            api) packages=('@smcp/api' '@smcp/schemas') ;;
            worker) packages=('smcp-compression-worker') ;;
            capsule) packages=() ;;
            *) exit 2 ;;
          esac
          for package in "${packages[@]}"; do
            jq --exit-status --arg package "$package" \
              'any(.packages[]; .name == $package and .licenseDeclared == "Apache-2.0")' \
              "$SBOM" >/dev/null
          done
      - name: Publish scanned image without rebuilding
        id: publish
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/smcp-${{ matrix.image }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_NAME}:${VERSION}") == "$GITHUB_SHA" ]]
          [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${IMAGE_NAME}:${VERSION}") == "$VERSION" ]]
          [[ $(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "${IMAGE_NAME}:${VERSION}") == "Apache-2.0" ]]
          docker push "${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:latest"
          digest=$(docker image inspect --format '{{ index .RepoDigests 0 }}' "${IMAGE_NAME}:${VERSION}")
          digest=${digest##*@}
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest exact image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/smcp-${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest exact image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/smcp-${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: smcp-${{ matrix.image }}-${{ github.ref_name }}.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Upload exact image SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.image }}
          path: smcp-${{ matrix.image }}-${{ github.ref_name }}.spdx.json
          if-no-files-found: error
          retention-days: 90

  release:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download exact image SBOMs
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: sbom-*
          path: sboms
          merge-multiple: true
      - name: Create source archives and checksums
        run: |
          set -euo pipefail
          source_archive="smcp-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz --prefix=space-message-compression-platform/ -o "$source_archive" HEAD
          artifacts=("$source_archive" sboms/*.spdx.json)
          sha256sum "${artifacts[@]}" > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifacts=("smcp-${GITHUB_REF_NAME}.tar.gz" SHA256SUMS sboms/*.spdx.json)
          gh release create "$GITHUB_REF_NAME" "${artifacts[@]}" --generate-notes --verify-tag
