[project]
name = "smcp-sdk"
version = "0.1.0"
description = "Typed Python client for the Space Message Compression API"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy>=1.19,<3", "pytest>=9,<10", "ruff>=0.16,<0.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/smcp_sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
