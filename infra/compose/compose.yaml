name: smcp

x-app-environment: &app-environment
  DATABASE_URL: postgresql://smcp:smcp@postgres:5432/smcp
  VALKEY_URL: redis://valkey:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: smcp-private
  S3_ACCESS_KEY_ID: smcp-local
  S3_SECRET_ACCESS_KEY: smcp-local-change-me
  S3_FORCE_PATH_STYLE: "true"
  MAX_UPLOAD_BYTES: "1073741824"

services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: smcp
      POSTGRES_USER: smcp
      POSTGRES_PASSWORD: smcp
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docker/postgres-healthcheck.sh:/usr/local/bin/smcp-healthcheck:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "/usr/local/bin/smcp-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  migrate:
    image: postgres:17.6-alpine3.22
    environment:
      DATABASE_URL: postgresql://smcp:smcp@postgres:5432/smcp
    volumes:
      - ../migrations:/migrations:ro
      - ../docker/apply-migrations.sh:/usr/local/bin/apply-migrations:ro
    command: ["/bin/sh", "/usr/local/bin/apply-migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  valkey:
    image: valkey/valkey:8.1.3-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: smcp-local
      MINIO_ROOT_PASSWORD: smcp-local-change-me
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  create-bucket:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 smcp-local smcp-local-change-me
        mc mb --ignore-existing local/smcp-private
        mc anonymous set none local/smcp-private
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
    environment:
      <<: *app-environment
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      API_ORIGIN: http://localhost:3001
      WEB_ORIGIN: http://localhost:3000
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY in .env}
      CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY in .env}
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker/Dockerfile
    environment:
      <<: *app-environment
      WORKER_CONSUMER_NAME: worker-1
      WORKER_GROUP: compression-workers
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    stop_grace_period: 30s

volumes:
  postgres-data:
  minio-data:
