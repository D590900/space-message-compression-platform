title = "SMCP Gitleaks configuration"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Deterministic 32-byte AES fixture used only by webhook unit tests"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''^\s*(?:WEBHOOK_SECRET_ENCRYPTION_KEY:\s*|const encryptionKey = )"MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI="[,;]\s*$''']
paths = [
  '''^apps/api/test/system-routes\.test\.ts$''',
  '''^apps/api/test/capsule-plan\.test\.ts$''',
  '''^apps/api/test/api-key-routes\.test\.ts$''',
  '''^apps/api/test/webhook-security\.test\.ts$''',
]
