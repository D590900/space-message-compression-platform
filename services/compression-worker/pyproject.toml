[project]
name = "smcp-compression-worker"
version = "0.1.0"
description = "Quality-gated compression worker for SMCP"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "boto3>=1.42,<2",
  "brotli>=1.1,<2",
  "fastapi>=0.135,<1",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "prometheus-client>=0.22,<1",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.13,<3",
  "python-magic>=0.4.27,<1",
  "redis>=7.3,<8",
  "requests>=2.34,<3",
  "uvicorn>=0.41,<1",
  "zstandard>=0.25,<1",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.43,<2",
  "mypy>=1.19,<3",
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.15,<1",
]

[project.scripts]
smcp-worker = "smcp_worker.main:run"

[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smcp_worker"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=smcp_worker --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["smcp_worker"]

[[tool.mypy.overrides]]
module = "brotli"
ignore_missing_imports = true
