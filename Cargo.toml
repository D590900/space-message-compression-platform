[workspace]
members = [
  "crates/capsule-cli",
  "crates/capsule-format",
  "crates/capsule-planner",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/D590900/space-message-compression-platform"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

